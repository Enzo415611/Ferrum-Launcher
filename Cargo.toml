[package]
name = "ferrum_launcher"
version = "0.1.0"
authors = ["Enzo Queiroz Costa <enzo415611@gmail.com>"]
edition = "2021"


[dependencies]
anyhow = "1.0.104"
dioxus = { version = "0.7.9", features = ["router"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus_style = "0.5.3"
directories = "6.0.0"
keyring = "4.1.5"
lighty-launcher = { version = "26.5.12", features = [
    "all-loaders",
    "events",
    "keyring",
] }
regex = "1.13.1"
sea-orm = { version = "2.0.0", features = [
    "runtime-tokio",
    "sqlx-sqlite",
    "macros",
    "schema-sync",
    "entity-registry",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync"] }


[build-dependencies]
dotenvy = "0.15.7"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
